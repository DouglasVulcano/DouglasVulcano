name: snake

# Desenha a cobrinha que "come" o gráfico de contribuições e publica os SVGs na branch `output`.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff6a2b&color_dots=#161b22,#4a1d0c,#8a3413,#d9531e,#ffb454
            dist/snake-light.svg?color_snake=#e0501a&color_dots=#ebedf0,#ffd8c2,#ffab80,#ff7a3d,#e0501a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
