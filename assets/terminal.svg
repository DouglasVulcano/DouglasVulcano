<svg xmlns="http://www.w3.org/2000/svg" width="880" height="477" viewBox="0 0 880 477" role="img" aria-labelledby="tt td">
<title id="tt">Terminal de Douglas Vulcano</title>
<desc id="td">Terminal digitando: whoami, a stack em JSON (Node.js, NestJS, Next.js, React, TypeScript, Docker, AWS e ferramentas de IA) e os produtos Nexo e Zeroth.</desc>
<style>@font-face{font-family:'Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'MonoB';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
        text{font-family:'Mono',ui-monospace,monospace;font-size:16px;white-space:pre}
        .p{font-family:'MonoB','Mono',monospace}
        .cover{animation-fill-mode:both;animation-timing-function:steps(var(--n))}
        @keyframes type{from{transform:translateX(0)}to{transform:translateX(var(--w))}}
        .out{opacity:0;animation:out .35s ease-out forwards}
        @keyframes out{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
        .caret{opacity:0;animation:show 0s linear forwards, blink 1s steps(2) infinite}
        @keyframes show{to{opacity:1}}
        @keyframes blink{50%{fill-opacity:0}}
        .beam{animation:spin 7s linear infinite;transform-box:view-box}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .in, .fin { opacity: 1 !important; } }@media (prefers-reduced-motion: reduce){.cover{display:none}.out,.caret{opacity:1 !important}}</style>
<defs>
<clipPath id="win"><rect width="880" height="477" rx="16"/></clipPath>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6a2b" stop-opacity="0"/><stop offset=".85" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ffb454"/></linearGradient>
<mask id="ring"><rect width="880" height="477" rx="16" fill="#fff"/><rect x="1.5" y="1.5" width="877" height="474" rx="14.5" fill="#000"/></mask>
</defs>
<g clip-path="url(#win)">
<rect width="880" height="477" fill="#0d1015"/>
<rect width="880" height="46" fill="#11151c"/>
<rect y="46" width="880" height="1" fill="#1f2530"/>
<circle cx="26" cy="23" r="6.5" fill="#ff5f57"/><circle cx="48" cy="23" r="6.5" fill="#febc2e"/><circle cx="70" cy="23" r="6.5" fill="#28c840"/>
<text x="94" y="28" fill="#8d96a4" font-size="13">douglas@vulcano: ~</text>
<g class="out" style="animation-delay:0.60s"><text x="30" y="78" fill="#ff8a3d" class="p">❯</text><text x="52" y="78" fill="#eeece7">whoami</text></g>
<rect class="cover" x="50" y="60" width="71.6" height="24" fill="#0d1015" style="--n:6;--w:71.6px;animation-name:type;animation-duration:0.33s;animation-delay:0.75s"/>
<text class="out" x="30" y="103" fill="#b3bac5" style="animation-delay:1.53s">douglas-vulcano · desenvolvedor full stack</text>
<g class="out" style="animation-delay:1.90s"><text x="30" y="138" fill="#ff8a3d" class="p">❯</text><text x="52" y="138" fill="#eeece7">cat stack.json</text></g>
<rect class="cover" x="50" y="120" width="148.4" height="24" fill="#0d1015" style="--n:14;--w:148.4px;animation-name:type;animation-duration:0.77s;animation-delay:2.05s"/>
<text class="out" x="30" y="163" fill="#8d96a4" style="animation-delay:3.27s">{</text>
<text class="out" x="30" y="188" fill="#ffb454" style="animation-delay:3.34s">  &quot;backend&quot;:  [&quot;Node.js&quot;, &quot;NestJS&quot;, &quot;REST&quot;, &quot;PostgreSQL&quot;],</text>
<text class="out" x="30" y="213" fill="#ffb454" style="animation-delay:3.41s">  &quot;frontend&quot;: [&quot;Next.js&quot;, &quot;React&quot;, &quot;TypeScript&quot;],</text>
<text class="out" x="30" y="238" fill="#ffb454" style="animation-delay:3.48s">  &quot;cloud&quot;:    [&quot;Docker&quot;, &quot;AWS&quot;, &quot;CI/CD&quot;],</text>
<text class="out" x="30" y="263" fill="#ffb454" style="animation-delay:3.55s">  &quot;ai&quot;:       [&quot;Claude Code&quot;, &quot;Copilot&quot;, &quot;Gemini&quot;]</text>
<text class="out" x="30" y="288" fill="#8d96a4" style="animation-delay:3.62s">}</text>
<g class="out" style="animation-delay:3.99s"><text x="30" y="323" fill="#ff8a3d" class="p">❯</text><text x="52" y="323" fill="#eeece7">ls ~/produtos</text></g>
<rect class="cover" x="50" y="305" width="138.8" height="24" fill="#0d1015" style="--n:13;--w:138.8px;animation-name:type;animation-duration:0.71s;animation-delay:4.14s"/>
<text class="out" x="30" y="348" fill="#34d399" style="animation-delay:5.30s">nexo/    zeroth/</text>
<g class="out" style="animation-delay:5.67s"><text x="30" y="383" fill="#ff8a3d" class="p">❯</text><text x="52" y="383" fill="#eeece7">git log --oneline -1</text></g>
<rect class="cover" x="50" y="365" width="206.0" height="24" fill="#0d1015" style="--n:20;--w:206.0px;animation-name:type;animation-duration:1.10s;animation-delay:5.83s"/>
<text class="out" x="30" y="408" fill="#b3bac5" style="animation-delay:7.38s">feat: construindo o próximo produto</text>
<text class="out" x="30" y="443" fill="#ff8a3d" style="animation-delay:7.90s">❯</text>
<rect class="caret" x="52" y="428" width="9" height="19" fill="#ff8a3d" style="animation-delay:7.90s,7.90s"/>
</g>
<rect width="880" height="477" rx="16" fill="none" stroke="#1f2530"/>
<g mask="url(#ring)"><rect class="beam" x="440.0" y="168.5" width="880" height="140" fill="url(#beam)" style="transform-origin:440.0px 238.5px"/></g>
</svg>